# Configuração do Proxy Reverso Nginx - Plataforma IAprofEPT
# Autor: Equipe de Engenharia IAProfEPT
# Caminho sugerido no servidor UFJF: /etc/nginx/sites-available/iaprofept.conf

# Redireciona HTTP para HTTPS obrigatoriamente
server {
    listen 80;
    listen [::]:80;
    server_name iaprofept.ufjf.br www.iaprofept.ufjf.br;
    
    # Redirecionamento permanente
    return 301 https://$host$request_uri;
}

# Configuração Principal HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iaprofept.ufjf.br www.iaprofept.ufjf.br;

    # Caminhos para os Certificados (Gerados pelo Certbot / CA UFJF)
    ssl_certificate /etc/letsencrypt/live/iaprofept.ufjf.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iaprofept.ufjf.br/privkey.pem;
    
    # Políticas SSL Seguras
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeçalhos de Segurança (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # (Opcional) Content-Security-Policy definida também no proxy, caso não esteja apenas no backend
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://iaprofept.ufjf.br wss://iaprofept.ufjf.br;" always;

    # Diretório estático do Frontend (React/Vite Build)
    root /var/www/iaprofept/frontend/dist;
    index index.html;

    # Logs de Acesso e Erro
    access_log /var/log/nginx/iaprofept.access.log;
    error_log /var/log/nginx/iaprofept.error.log warn;

    # Rota do Frontend Estático (React Router Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o Backend (API Node.js rodando via PM2 na porta 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Repassa os IPs reais dos clientes para o limitador de taxa (Rate Limit) funcionar
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloqueia acesso a arquivos ocultos (.git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
